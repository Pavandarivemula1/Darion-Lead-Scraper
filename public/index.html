<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntiGravity Lead Generation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation & Config -->
        <aside class="sidebar glass-effect">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
                </div>
                <h2>AntiGravity</h2>
            </div>
            
            <p class="subtitle">Lead Generation Engine</p>
            
            <div class="config-section">
                <h3>New Scrape Job</h3>
                <form id="scrape-form">
                    <div class="form-group">
                        <label for="city">Target City</label>
                        <input type="text" id="city" value="London" required placeholder="e.g. New York">
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Business Category</label>
                        <input type="text" id="category" value="Plumbers" required placeholder="e.g. Gyms">
                    </div>
                    
                    <div class="form-group">
                        <label for="max-results">Maximum Results: <span id="max-val">20</span></label>
                        <input type="range" id="max-results" min="5" max="200" step="5" value="20">
                    </div>
                    
                    <button type="submit" class="primary-btn glow-btn">
                        <span>Initialize Scraper</span>
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
                    </button>
                </form>
                
                <div id="scrape-status" class="status-indicator hidden">
                    <div class="spinner"></div>
                    <span id="status-text">Scraper active...</span>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <header class="header">
                <div class="header-content">
                    <h1>Lead Intelligence Dashboard</h1>
                    <div class="header-actions">
                        <button class="theme-toggle-btn glass-effect" id="theme-toggle" aria-label="Toggle Theme">
                            <!-- Moon Icon -->
                            <svg id="moon-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                            <!-- Sun Icon -->
                            <svg id="sun-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                        </button>
                        <button class="bg-blur refresh-btn" id="refresh-btn">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                            Refresh Data
                        </button>
                    </div>
                </div>
            </header>
            
            <div class="controls-bar glass-effect">
                <div class="dataset-selector">
                    <label for="dataset-select">Active Dataset</label>
                    <select id="dataset-select">
                        <option value="">Loading datasets...</option>
                    </select>
                </div>
                
                <div class="search-box">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="search-input" placeholder="Search businesses, domains, or phones...">
                </div>
            </div>

            <!-- Metrics Grid -->
            <div class="metrics-grid">
                <div class="metric-card glass-effect">
                    <div class="metric-icon blue">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </div>
                    <div class="metric-info">
                        <p>Total Acquired Leads</p>
                        <h3 id="metric-total">--</h3>
                    </div>
                </div>
                
                <div class="metric-card glass-effect">
                    <div class="metric-icon purple">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    </div>
                    <div class="metric-info">
                        <p>High Quality (Score > 70)</p>
                        <h3 id="metric-hq">--</h3>
                    </div>
                </div>
                
                <div class="metric-card glass-effect">
                    <div class="metric-icon green">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    </div>
                    <div class="metric-info">
                        <p>WhatsApp Identified</p>
                        <h3 id="metric-wa">--</h3>
                    </div>
                </div>
            </div>

            <!-- Data Table -->
            <div class="data-container glass-effect">
                <div class="table-header">
                    <h3>Lead Directory</h3>
                    <button class="secondary-btn" id="download-btn" disabled>
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download CSV
                    </button>
                </div>
                <div class="table-wrapper">
                    <table id="leads-table">
                        <thead>
                            <tr>
                                <th>Score</th>
                                <th>Business Name</th>
                                <th>Category</th>
                                <th>Website</th>
                                <th>Phone</th>
                                <th>WA</th>
                                <th>Rating</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr>
                                <td colspan="7" class="empty-state">Select a dataset to view leads.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
